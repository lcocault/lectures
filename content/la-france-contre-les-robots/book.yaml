titre: La France contre les robots
auteur: Georges Bernanos
description: >-
  Essai-pamphlet écrit au Brésil à la fin de 1944, où Bernanos dénonce la civilisation
  des machines, le règne de l'efficacité et la résignation des peuples, et appelle la
  France à une révolution de l'esprit. Publié en 1947.
licence: Domaine public (Georges Bernanos, mort en 1948)
source:
  titre: Wikisource — La France contre les robots (édition Robert Laffont, 1947)
  url: https://fr.wikisource.org/wiki/La_France_contre_les_robots
audio: true
